<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Dünya Simülasyonu</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#panel {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    padding: 15px;
    color: white;
    background: rgba(0,0,0,.7);
    border: 1px solid #555;
    border-radius: 12px;
}

#panel h1 {
    margin: 0 0 10px;
    font-size: 22px;
}

#panel div {
    margin: 5px 0;
    color: #ddd;
}

#counter {
    color: orange !important;
    margin-top: 12px !important;
}

#message {
    position: fixed;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    color: white;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 15px #ff5500;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
}

#crosshair::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 2px;
    top: 10px;
    left: 0;
    background: white;
    box-shadow: 0 0 6px white;
}

#crosshair::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 22px;
    top: 0;
    left: 10px;
    background: white;
    box-shadow: 0 0 6px white;
}
</style>
</head>

<body>

<div id="panel">
    <h1>🌍 WORLD 3D</h1>
    <div>🖱️ Sol tık: Etki</div>
    <div>🖱️ Sürükle: Dünya'yı döndür</div>
    <div>🔍 Tekerlek: Yaklaş / uzaklaş</div>
    <div>⌨️ R: Dünyayı sıfırla</div>
    <div id="counter">Etkiler: 0</div>
</div>

<div id="crosshair"></div>
<div id="message"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";


/* =====================================================
   SAHNE
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000005);


/* =====================================================
   KAMERA
===================================================== */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    0,
    3
);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   IŞIK
===================================================== */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.4
    );

scene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    5,
    3,
    5
);

scene.add(
    sun
);


/* =====================================================
   DÜNYA GRUBU
===================================================== */

const world =
    new THREE.Group();

scene.add(
    world
);


/* =====================================================
   DÜNYA DOKUSU
===================================================== */

const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );


const earthNormal =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg"
    );


const earthSpecular =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg"
    );


earthTexture.colorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   DÜNYA
===================================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        1,
        128,
        128
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:
            earthTexture,

        normalMap:
            earthNormal,

        specularMap:
            earthSpecular,

        specular:
            new THREE.Color(
                0x333333
            ),

        shininess:
            15
    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );


world.add(
    earth
);


/* =====================================================
   BULUTLAR
===================================================== */

const cloudTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
    );


const cloudMaterial =
    new THREE.MeshPhongMaterial({

        map:
            cloudTexture,

        transparent:
            true,

        opacity:
            0.5,

        depthWrite:
            false
    });


const clouds =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.015,
            128,
            128
        ),

        cloudMaterial
    );


world.add(
    clouds
);


/* =====================================================
   ATMOSFER
===================================================== */

const atmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.08,
            96,
            96
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x168cff,

            transparent:
                true,

            opacity:
                0.17,

            side:
                THREE.BackSide
        })
    );


scene.add(
    atmosphere
);


/* =====================================================
   YILDIZLAR
===================================================== */

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];


for (
    let i = 0;
    i < 7000;
    i++
) {

    const radius =
        30 +
        Math.random() * 100;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    const x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    const z =
        radius *
        Math.cos(phi);

    starPositions.push(
        x,
        y,
        z
    );
}


starGeometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            0.06
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(
    stars
);


/* =====================================================
   MOUSE DÖNDÜRME
===================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;


renderer.domElement.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;
    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;
    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;


        const dx =
            event.clientX -
            lastX;

        const dy =
            event.clientY -
            lastY;


        world.rotation.y +=
            dx * 0.006;

        world.rotation.x +=
            dy * 0.006;


        world.rotation.x =
            THREE.MathUtils.clamp(
                world.rotation.x,
                -1.4,
                1.4
            );


        lastX =
            event.clientX;

        lastY =
            event.clientY;
    }
);


/* =====================================================
   ZOOM
===================================================== */

window.addEventListener(
    "wheel",
    function(event) {

        camera.position.z +=
            event.deltaY * 0.002;


        camera.position.z =
            THREE.MathUtils.clamp(
                camera.position.z,
                1.5,
                7
            );
    }
);


/* =====================================================
   ETKİ SİSTEMİ
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

let impacts = [];

let impactCount = 0;


/* =====================================================
   TIKLAMA
===================================================== */

renderer.domElement.addEventListener(
    "click",
    function(event) {

        mouse.x =
            event.clientX /
            window.innerWidth *
            2 - 1;


        mouse.y =
            -(event.clientY /
            window.innerHeight) *
            2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObject(
                earth
            );


        if (
            hits.length === 0
        ) {
            return;
        }


        createImpact(
            hits[0].point.clone()
        );
    }
);


/* =====================================================
   ETKİ
===================================================== */

function createImpact(point) {

    impactCount++;


    document.getElementById(
        "counter"
    ).textContent =
        "Etkiler: " +
        impactCount;


    /* Ateş topu */

    const fire =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.08,
                24,
                24
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xff4500,

                transparent:
                    true,

                opacity:
                    0.9
            })
        );


    fire.position.copy(
        point.clone()
            .multiplyScalar(1.015)
    );


    world.add(
        fire
    );


    /* Şok dalgası */

    const ring =
        new THREE.Mesh(

            new THREE.RingGeometry(
                0.04,
                0.06,
                48
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xff8c00,

                transparent:
                    true,

                opacity:
                    1,

                side:
                    THREE.DoubleSide
            })
        );


    ring.position.copy(
        point.clone()
            .multiplyScalar(1.02)
    );


    ring.lookAt(
        point.clone()
            .multiplyScalar(2)
    );


    world.add(
        ring
    );


    /* Yüzey izi */

    const mark =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                0.06,
                32
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x21130b,

                transparent:
                    true,

                opacity:
                    0.9
            })
        );


    mark.position.copy(
        point.clone()
            .multiplyScalar(1.025)
    );


    mark.lookAt(
        point.clone()
            .multiplyScalar(2)
    );


    world.add(
        mark
    );


    impacts.push({

        fire:
            fire,

        ring:
            ring,

        mark:
            mark,

        life:
            1
    });


    showMessage(
        "IMPACT!"
    );
}


/* =====================================================
   MESAJ
===================================================== */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.opacity =
        "1";


    clearTimeout(
        message.timer
    );


    message.timer =
        setTimeout(
            function() {

                message.style.opacity =
                    "0";

            },
            500
        );
}


/* =====================================================
   RESET
===================================================== */

function resetWorld() {

    for (
        const impact
        of impacts
    ) {

        world.remove(
            impact.fire
        );

        world.remove(
            impact.ring
        );

        world.remove(
            impact.mark
        );
    }


    impacts = [];

    impactCount = 0;


    document.getElementById(
        "counter"
    ).textContent =
        "Etkiler: 0";


    world.rotation.set(
        0,
        0,
        0
    );


    camera.position.z =
        3;


    showMessage(
        "WORLD RESET"
    );
}


/* =====================================================
   KLAVYE
===================================================== */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "r" ||
            event.key === "R"
        ) {

            resetWorld();
        }
    }
);


/* =====================================================
   ANİMASYON
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
       Dünya dönüşü
    */

    earth.rotation.y +=
        0.0007;


    /*
       Bulut dönüşü
    */

    clouds.rotation.y +=
        0.001;


    /*
       Atmosfer
    */

    atmosphere.rotation.y -=
        0.0002;


    /*
       Yıldızlar
    */

    stars.rotation.y +=
        0.00002;


    /*
       Etkiler
    */

    for (
        let i =
            impacts.length - 1;

        i >= 0;

        i--
    ) {

        const impact =
            impacts[i];


        impact.life -=
            0.018;


        impact.ring.scale.multiplyScalar(
            1.05
        );


        impact.fire.scale.multiplyScalar(
            0.97
        );


        impact.ring.material.opacity =
            impact.life;


        impact.fire.material.opacity =
            impact.life;


        if (
            impact.life <= 0
        ) {

            world.remove(
                impact.fire
            );

            world.remove(
                impact.ring
            );


            /*
               Mark yani yüzey izi
               Dünya üzerinde kalır.
            */

            impacts.splice(
                i,
                1
            );
        }
    }


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   EKRAN BOYUTU
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


animate();

</script>

</body>
</html>
